name: Smart Contract QA Regression Suite

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  blockchain-qa-tests:
    runs-on: ubuntu-latest
    env:
      HARDHAT_DISABLE_TELEMETRY: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Compile Solidity contracts
        run: npm run compile

      - name: Start local Hardhat blockchain node
        run: |
          npx hardhat node > hardhat-node.log 2>&1 &
          sleep 8

      - name: Deploy smart contract to local blockchain
        run: npm run deploy:local

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PyTest smart contract regression suite
        run: pytest -v --html=reports/pytest_report.html --self-contained-html

      - name: Upload PyTest HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-smart-contract-report
          path: reports/pytest_report.html

      - name: Upload Gas Usage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-usage-report
          path: reports/gas_report.json

      - name: Upload Hardhat Node Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardhat-node-logs
          path: hardhat-node.log
